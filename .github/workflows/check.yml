name: Build application and test


on:
  workflow_dispatch:
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches:
      - 'prod'
      - 'main'
      - 'dev'
  push:
    branches:
      - 'main'
      - 'master'
      - 'prod'


env:
  CARGO_TERM_COLOR: always
  SCCACHE_CACHE_SIZE: 2G
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"

jobs:
  ci-common:
    name: Common (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mold

      - name: Cache Cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target.id }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target.id }}-
            ${{ runner.os }}-cargo-

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target.id }}

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Analyze code
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  ci-linux:
    name: Linux (${{ matrix.target.id }})
    needs: ci-common

    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cpu: x86-64-v3
          - id: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cpu: x86-64-v3
          - id: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            cpu: armv8-a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mold

      - name: Cache Cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target.id }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target.id }}-
            ${{ runner.os }}-cargo-

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target.id }}

      - name: Test
        run: cargo nextest --workspace --all-targets --all-features --profile dev --target ${{ matrix.target.id }}
        env:
          RUSTFLAGS: -C linker=clang -C link-arg=-fuse-ld=mold -C target-cpu=${{ matrix.target.cpu }}


  ci-macos:
    name: macOS (${{ matrix.target.id }})
    needs: ci-common

    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: aarch64-apple-darwin
            cpu: apple-m1
          - id: x86_64-apple-darwin
            cpu: x86-64-v3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target.id }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target.id }}-
            ${{ runner.os }}-cargo-

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target.id }}

      - name: Test
        run: cargo nextest --workspace --all-targets --all-features --profile dev --target ${{ matrix.target.id }}
        env:
          RUSTFLAGS: -C target-cpu=${{ matrix.target.cpu }}


  ci-windows:
    name: Windows (${{ matrix.target.id }})
    needs: ci-common

    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: x86_64-pc-windows-msvc
            cpu: x86-64-v3
          - id: aarch64-pc-windows-msvc
            cpu: armv8-a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target.id }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target.id }}-
            ${{ runner.os }}-cargo-

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target.id }}

      - name: Test
        run: cargo nextest --workspace --all-targets --all-features --profile dev --target ${{ matrix.target.id }}
        env:
          RUSTFLAGS: -C linker=rust-lld.exe -C target-cpu=${{ matrix.target.cpu }}

